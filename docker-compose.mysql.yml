services:
  mysql:
    image: mysql:8.4
    container_name: grammarforge-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: grammarforge
      MYSQL_USER: grammarforge
      MYSQL_PASSWORD: grammarforge_password
    ports:
      - "3306:3306"
    volumes:
      - grammarforge_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  grammarforge_mysql_data:
